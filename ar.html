<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>恐竜ARスタンプラリー</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="js/dinosaurs.js"></script>
  <script src="js/collection.js"></script>

  <script>
    // =========================================================
    // 【修正版】GLBのサイズ正規化 ＋ 中心位置の自動補正コンポーネント
    // =========================================================
    AFRAME.registerComponent('fit-gltf-on-marker', {
      schema: {
        // GLBごとの元サイズ差をそろえるため、まず最大辺が1になるように正規化します。
        normalizeTarget: { type: 'number', default: 1 }
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          // 1. 正確なバウンディングボックスを測るため、一時的にトランスフォームを初期化
          this.el.object3D.scale.set(1, 1, 1);
          this.el.object3D.position.set(0, 0, 0);
          this.el.object3D.updateMatrixWorld(true);

          // 2. バウンディングボックス、サイズ、幾何学的中心を取得
          const box = new THREE.Box3().setFromObject(mesh);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          // 3. サイズを基準値(1)に揃えるための正規化倍率を計算
          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim === 0) return;
          const normalScale = this.data.normalizeTarget / maxDim;

          // 4. 正規化倍率をコンポーネントに記憶させる（スライダー調整時に再利用するため）
          this.normalScale = normalScale;
          // モデルの「真のローカル中心」と「底面」の情報を記憶
          this.modelCenter = center.clone();
          this.modelMinY = box.min.y;

          // 5. 初回の位置とサイズを適用
          this.applyFinalTransform();
        });
      },

      // スライダー操作などで dinosaurs.js のベース値やDelta値が変わったときに呼び出される共通処理
      applyFinalTransform: function () {
        if (!this.modelCenter) return;

        // 現在適用すべき最終的なARスケール倍率を取得 (ベース値 ＋ スライダーの変動値)
        const s = window.getFinalARScale();

        // 3Dモデル全体のスケールを設定（正規化倍率 × 最終ARスケール）
        const finalScale = this.normalScale * s;
        this.el.object3D.scale.set(finalScale, finalScale, finalScale);

        // Blender上での原点ズレを打ち消す位置を計算
        // XとZは中心のズレを反転（マイナス）させて、マーカーの真ん中(0,0)に引き戻す
        const posX = -this.modelCenter.x * finalScale;
        const posZ = -this.modelCenter.z * finalScale;

        // Y（高さ）は、モデルの一番下の頂点（底面）がマーカーの表面(0)にぴったり乗るように補正
        // そこに、dinosaurs.js のベースYオフセットとスライダーの変動値を足す
        const baseOffsetY = window.getFinalARYOffset();
        const posY = (-this.modelMinY * finalScale) + baseOffsetY;

        // 計算した位置を反映
        this.el.object3D.position.set(posX, posY, posZ);
        this.el.object3D.updateMatrixWorld(true);
      }
    });
  </script>

  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --color-bg-panel: rgba(24, 24, 27, 0.85);
      --color-text-main: #ffffff;
      --color-text-muted: #a1a1aa;
      --color-accent: #3b82f6;
      --color-accent-hover: #2563eb;
      --color-border: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    .a-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 画面上部：ナビゲーション・案内表示 */
    .ar-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: max(16px, env(safe-area-inset-top)) 16px 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 16px;
      background-color: var(--color-bg-panel);
      color: var(--color-text-main);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      pointer-events: auto;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background-color 0.2s, transform 0.1s;
    }
    .button:active {
      transform: scale(0.96);
    }
    .button.primary {
      background-color: var(--color-accent);
      border-color: var(--color-accent);
    }
    .button.primary:active {
      background-color: var(--color-accent-hover);
    }

    .status-toast {
      align-self: center;
      background-color: rgba(0, 0, 0, 0.75);
      color: var(--color-text-main);
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: opacity 0.3s, transform 0.3s;
    }
    .status-toast.is-hidden {
      opacity: 0;
      transform: translateY(-10px);
    }

    /* 画面下部：スライダー調整パネル */
    .ar-control-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0) 100%);
      padding: 24px 20px calc(20px + env(safe-area-inset-bottom));
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 16px;
      pointer-events: none;
    }

    .panel-content {
      background-color: var(--color-bg-panel);
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      pointer-events: auto;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
    }

    .dino-info-summary {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 12px;
    }
    .dino-info-summary h1 {
      font-size: 20px;
      color: var(--color-text-main);
      font-weight: 700;
    }
    .dino-info-summary p {
      font-size: 13px;
      color: var(--color-text-muted);
      line-height: 1.4;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .control-label {
      width: 44px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-main);
    }
    .slider-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .range-slider {
      width: 100%;
      height: 36px;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
    }
    /* スライダートラックの共通スタイル */
    .range-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    .range-slider::-moz-range-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    /* スライダーつまみの共通スタイル */
    .range-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: var(--color-text-main);
      cursor: pointer;
      margin-top: -9px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: background-color 0.1s, transform 0.1s;
    }
    .range-slider::-webkit-slider-thumb:active {
      background: var(--color-accent);
      transform: scale(1.1);
    }
    .range-slider::-moz-range-thumb {
      height: 24px;
      width: 24px;
      border: none;
      border-radius: 50%;
      background: var(--color-text-main);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: background-color 0.1s, transform 0.1s;
    }
    .range-slider::-moz-range-thumb:active {
      background: var(--color-accent);
      transform: scale(1.1);
    }

    .button.toggle-btn {
      height: 36px;
      font-size: 12px;
      padding: 0 12px;
      border-radius: 18px;
      background-color: rgba(255, 255, 255, 0.08);
    }
    .button.toggle-btn.is-off {
      color: var(--color-text-muted);
      border-color: transparent;
      background-color: rgba(255, 255, 255, 0.03);
    }
  </style>
</head>
<body>

  <header class="ar-header">
    <div class="nav-bar">
      <a class="button" href="collection.html">コレクションを見る</a>
      <button class="button is-off toggle-btn" id="origin-toggle" type="button" aria-pressed="false">原点OFF</button>
    </div>
    <div class="status-toast is-hidden" id="status-toast" role="status">マーカーを探しています...</div>
  </header>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; exposure: 1.0;"
    vr-mode-ui="enabled: false">

    <a-entity light="type: ambient; intensity: 1.6;"></a-entity>
    <a-entity light="type: directional; intensity: 0.8;" position="1 4 2"></a-entity>

    </a-scene>

  <div class="ar-control-panel">
    <div class="panel-content" id="adjust-panel" style="display: none;">
      <div class="dino-info-summary">
        <h1 id="panel-dino-name">恐竜名</h1>
        <p id="panel-dino-desc">説明文がここに表示されます。</p>
      </div>
      
      <div class="control-row">
        <span class="control-label">サイズ</span>
        <div class="slider-wrapper">
          <input class="range-slider" id="scale-input" type="range" min="-0.8" max="2.0" step="0.05" value="0">
        </div>
      </div>

      <div class="control-row">
        <span class="control-label">上下</span>
        <div class="slider-wrapper">
          <input class="range-slider" id="y-input" type="range" min="-0.5" max="0.5" step="0.01" value="0">
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // 状態管理とARマーカー・モデルの動的生成
    // =========================================================
    const scene = document.querySelector('a-scene');
    const toast = document.getElementById('status-toast');
    const adjustPanel = document.getElementById('adjust-panel');
    const panelName = document.getElementById('panel-dino-name');
    const panelDesc = document.getElementById('panel-dino-desc');
    const scaleInput = document.getElementById('scale-input');
    const yInput = document.getElementById('y-input');
    const originToggle = document.getElementById('origin-toggle');

    let currentId = null;       // 現在認識している恐竜のID
    let showOrigin = false;     // デバッグ用の原点（赤い球）を表示するかどうか
    const arAdjustments = {};   // ユーザーがスライダーで変更した値を一時保存するオブジェクト

    // アプリ起動時にトーストを初期表示
    setTimeout(() => {
      if (!currentId) {
        toast.textContent = 'マーカーにカメラをかざしてください';
        toast.classList.remove('is-hidden');
      }
    }, 1000);

    // 特定の恐竜の調整データを取得するヘルパー関数
    function getAdjust(id) {
      if (!id) return { scaleDelta: 0, yDelta: 0 };
      if (!arAdjustments[id]) {
        arAdjustments[id] = { scaleDelta: 0, yDelta: 0 };
      }
      return arAdjustments[id];
    }

    // 現在認識中の恐竜の「最終的なARスケール（倍率）」を計算して返す関数
    window.getFinalARScale = function() {
      const dino = window.DINOSAURS.find(d => d.id === currentId);
      if (!dino) return 1.0;
      const adjust = getAdjust(currentId);
      // dinosaurs.js のベースarScaleに、スライダーの増減（1.0 + delta）を掛け合わせる
      return dino.arScale * (1.0 + adjust.scaleDelta);
    };

    // 現在認識中の恐竜の「最終的な上下位置（Yオフセット）」を計算して返す関数
    window.getFinalARYOffset = function() {
      const dino = window.DINOSAURS.find(d => d.id === currentId);
      if (!dino) return 0;
      const adjust = getAdjust(currentId);
      // dinosaurs.js のベースarYOffsetに、スライダーの増減値を足し算する
      return dino.arYOffset + adjust.yDelta;
    };

    // スライダーの値が変更されたときに、3Dモデルの変形を即座に再計算・反映する処理
    function applyAdjustSettings() {
      if (!currentId) return;
      const modelEntity = document.querySelector(`[data-dino-id="${currentId}"] gltf-model`);
      if (modelEntity && modelEntity.components['fit-gltf-on-marker']) {
        // コンポーネント内の再計算メソッドを強制実行
        modelEntity.components['fit-gltf-on-marker'].applyFinalTransform();
      }
    }

    // 恐竜データ一覧ループ：それぞれのa-markerとモデルをシーンに追加
    window.DINOSAURS.forEach((dino) => {
      const marker = document.createElement('a-marker');
      marker.setAttribute('type', 'pattern');
      marker.setAttribute('url', dino.marker);
      marker.setAttribute('data-dino-id', dino.id);
      marker.setAttribute('emitevents', 'true');

      // 視認性とデバッグ用の原点マーカー（赤い球体、標準では非表示）
      const originBall = document.createElement('a-sphere');
      originBall.setAttribute('class', 'demo-origin-ball');
      originBall.setAttribute('radius', '0.04');
      originBall.setAttribute('color', '#ef4444');
      originBall.setAttribute('visible', String(showOrigin));
      marker.appendChild(originBall);

      // GLTFモデル本体の生成
      const model = document.createElement('a-entity');
      model.setAttribute('gltf-model', `url(${dino.model})`);
      model.setAttribute('animation-mixer', '');
      
      // 新しいサイズ正規化＆中心補正コンポーネントをアタッチ
      model.setAttribute('fit-gltf-on-marker', 'normalizeTarget: 1.0');

      marker.appendChild(model);

      // マーカーがカメラに認識された（画面に入った）時の処理
      marker.addEventListener('markerFound', () => {
        currentId = dino.id;

        // コレクション保存処理を呼び出し（自動保存）
        if (window.addToCollection) {
          const isNew = window.addToCollection(dino.id);
          toast.textContent = isNew ? `🎉 新しい恐竜「${dino.name}」を発見！` : `「${dino.name}」を認識しました`;
        } else {
          toast.textContent = `「${dino.name}」を認識しました`;
        }
        toast.classList.remove('is-hidden');

        // 下部パネルに恐竜の情報を流し込んで表示
        panelName.textContent = dino.name;
        panelDesc.textContent = dino.description;
        adjustPanel.style.display = 'flex';

        // スライダーのツマミ位置をこの恐竜の保存値に同期
        window.refreshARAdjustPanel();
      });

      // マーカーが画面から外れた（見失った）時の処理
      marker.addEventListener('markerLost', () => {
        if (currentId === dino.id) {
          currentId = null;
          toast.textContent = 'マーカーを探しています...';
          adjustPanel.style.display = 'none';
        }
      });

      scene.appendChild(marker);
    });

    // デバッグ用原点表示ボタンの切り替えロジック
    originToggle?.addEventListener('click', () => {
      showOrigin = !showOrigin;
      document.querySelectorAll('.demo-origin-ball').forEach((ball) => {
        ball.setAttribute('visible', showOrigin);
      });

      if (originToggle) {
        originToggle.textContent = showOrigin ? '原点ON' : '原点OFF';
        originToggle.classList.toggle('is-off', !showOrigin);
        originToggle.setAttribute('aria-pressed', String(showOrigin));
      }
    });

    // 今認識している恐竜の調整値をスライダーへ反映します
    window.refreshARAdjustPanel = function refreshARAdjustPanel() {
      const adjust = getAdjust(currentId);
      if (scaleInput) scaleInput.value = String(adjust.scaleDelta);
      if (yInput) yInput.value = String(adjust.yDelta);
      applyAdjustSettings();
    };

    // サイズスライダーを動かしたときのイベント
    scaleInput?.addEventListener('input', () => {
      const ids = currentId ? [currentId] : window.DINOSAURS.map(d => d.id);
      ids.forEach((id) => { getAdjust(id).scaleDelta = Number(scaleInput.value || 0); });
      applyAdjustSettings();
    });

    // 上下スライダーを動かしたときのイベント
    yInput?.addEventListener('input', () => {
      const ids = currentId ? [currentId] : window.DINOSAURS.map(d => d.id);
      ids.forEach((id) => { getAdjust(id).yDelta = Number(yInput.value || 0); });
      applyAdjustSettings();
    });
  </script>
</body>
</html>
